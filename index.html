<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070606">
<meta name="description" content="A Profecia — sistema de RPG sombrio.">
<title>A Profecia</title>
<link rel="icon" type="image/png" href="/runa-gold.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- V66: Content-Security-Policy. Bloqueia qualquer <script> que não seja do próprio site (e do SDK do Spotify), o que
     barra a maior parte dos ataques de injeção de código (XSS). Se algum recurso externo novo deixar de carregar,
     o console do navegador mostra "Refused to ... because it violates the Content Security Policy": basta liberar
     o domínio na diretiva correspondente. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; media-src 'self' data: blob: https: http:; connect-src 'self' https: http: wss: ws:; frame-src https://open.spotify.com https://sdk.scdn.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
</head>
<body>
<div class="abyss-bg" aria-hidden="true"></div>
<div id="root"></div>
<div id="global-player"></div>
<div id="soundboard-root"></div>
<div id="personal-player"></div>
<div id="toast-root" aria-live="polite"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
