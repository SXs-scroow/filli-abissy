<!-- V66: Content-Security-Policy. Bloqueia qualquer <script> que não seja do próprio site (e do SDK do Spotify), o que
     barra a maior parte dos ataques de injeção de código (XSS). Se algum recurso externo novo deixar de carregar,
     o console do navegador mostra "Refused to ... because it violates the Content Security Policy": basta liberar
     o domínio na diretiva correspondente. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://sdk.scdn.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://open.spotify.com https://api.spotify.com https://accounts.spotify.com https://sdk.scdn.co https://*.spotify.com wss://*.spotify.com; frame-src https://open.spotify.com https://sdk.scdn.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap">
</head>
